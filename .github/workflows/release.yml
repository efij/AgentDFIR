name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test
        run: go test -race ./...

      - name: Cross-compile
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/efij/AgentDFIR/internal/version.Version=${VERSION}"
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            out="agentdfir-${VERSION}-${os}-${arch}"
            bin="agentdfir"
            [ "$os" = "windows" ] && bin="agentdfir.exe"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$LDFLAGS" -o "dist/$bin" ./cmd/agentdfir
            ( cd dist && tar -czf "${out}.tar.gz" "$bin" && rm -f "$bin" )
          done
          ( cd dist && sha256sum *.tar.gz > SHA256SUMS.txt )

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body_path: /dev/null
