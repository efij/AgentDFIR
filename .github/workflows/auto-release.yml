name: Auto-release

# Tagging is what bumping the version does, not a step someone has to remember
# afterwards.
#
# The hole this closes: v2.1.0, v2.2.0 and v2.2.1 were each committed to main
# with internal/version/version.go bumped, and never tagged. release.yml only
# runs on a tag push, so no release was ever cut for any of them and nothing
# in the repository noticed — `gh release list` sat at v2.0.1 for three
# versions while main said 2.2.1. Every install path kept serving a binary
# that predated the fixes, including one that had made Codex CLI sessions
# invisible to every detection. The gap was found by hand, four versions late.
#
# A tag pushed with GITHUB_TOKEN does not trigger a `push` workflow (GitHub
# blocks that to stop recursion), so this creates the tag and then dispatches
# release.yml *against the tag ref*. That keeps the Sigstore certificate
# identity identical to a hand-pushed tag, which is what docs/install.md tells
# people to verify against.

on:
  push:
    branches: [main]
    paths:
      - internal/version/version.go
  workflow_dispatch:

permissions:
  contents: write # create and push the tag
  actions: write # dispatch release.yml

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, so an existing one is seen rather than re-created

      - name: Tag the version and start the release
        run: |
          set -euo pipefail
          V=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/version/version.go)
          if [ -z "$V" ]; then
            echo "::error::could not read Version from internal/version/version.go"
            exit 1
          fi
          # Only exact release versions are tagged. A -dev or -rc suffix is how
          # main carries an unreleased version between releases, and tagging
          # one would publish it. This also means nothing but X.Y.Z ever
          # reaches a tag name or a workflow input below.
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version '$V' is not a release version (X.Y.Z); nothing to tag"
            exit 0
          fi
          TAG="v$V"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
          else
            echo "tagging $TAG at $GITHUB_SHA"
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

          # Published already (a re-run, or the tag was pushed by hand and
          # release.yml did its job): nothing to start.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
            echo "release $TAG is already published"
            exit 0
          fi

          echo "dispatching release.yml against $TAG"
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG" -f build=true
          echo "### Release $TAG started" >> "$GITHUB_STEP_SUMMARY"
          echo "Watch it: <$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml>" >> "$GITHUB_STEP_SUMMARY"
