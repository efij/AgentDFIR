<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>AgentDFIR case explorer</title>
<style>
/* Tokens. Light is the default; dark follows the OS unless the toggle
   pins one. Severity is a fixed signal scale and never the only cue: every
   chip also carries its word. */
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--surface-2:#EEF1F5;--surface-3:#E4E8EE;
  --ink:#172033;--ink-2:#3A4458;--muted:#5C687B;--line:#D9DEE6;--line-2:#C4CBD6;
  --accent:#2449C6;--accent-ink:#FFFFFF;--accent-soft:#E7EDFC;
  --act:#B42318;--act-bg:#FDECEA;--serious:#B93E0B;--serious-bg:#FFF0E5;
  --look:#805A00;--look-bg:#FFF4D6;--minor:#2D5DA8;--minor-bg:#E7EFFB;--record:#5C687B;--record-bg:#EEF1F5;
  --ok:#1D7443;--ok-bg:#E4F3EA;
  --you:#6B46C1;--you-bg:#F1ECFB;--agent:#0F6E66;--agent-bg:#E2F3F1;--tool:#475569;--tool-bg:#EDF0F4;
  --shadow:0 1px 2px rgba(23,32,51,.06),0 4px 16px rgba(23,32,51,.06);
  --scrim:rgba(15,20,30,.45);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r-sm:6px;--r:10px;--r-lg:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1117;--surface:#161B24;--surface-2:#1D2430;--surface-3:#252E3C;
  --ink:#E7EBF2;--ink-2:#C3CAD6;--muted:#97A1B2;--line:#2A3342;--line-2:#3A4556;
  --accent:#8AA6FF;--accent-ink:#0E1117;--accent-soft:#1E2A4A;
  --act:#FF8F85;--act-bg:#3A1719;--serious:#FFAE78;--serious-bg:#3A2314;
  --look:#F0C75A;--look-bg:#332A10;--minor:#92BAFF;--minor-bg:#17263E;--record:#A3ADBD;--record-bg:#222A36;
  --ok:#72D6A0;--ok-bg:#12301F;
  --you:#BBA2FF;--you-bg:#271E42;--agent:#62D5C5;--agent-bg:#10302C;--tool:#AEB9CB;--tool-bg:#232B37;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--scrim:rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0E1117;--surface:#161B24;--surface-2:#1D2430;--surface-3:#252E3C;
  --ink:#E7EBF2;--ink-2:#C3CAD6;--muted:#97A1B2;--line:#2A3342;--line-2:#3A4556;
  --accent:#8AA6FF;--accent-ink:#0E1117;--accent-soft:#1E2A4A;
  --act:#FF8F85;--act-bg:#3A1719;--serious:#FFAE78;--serious-bg:#3A2314;
  --look:#F0C75A;--look-bg:#332A10;--minor:#92BAFF;--minor-bg:#17263E;--record:#A3ADBD;--record-bg:#222A36;
  --ok:#72D6A0;--ok-bg:#12301F;
  --you:#BBA2FF;--you-bg:#271E42;--agent:#62D5C5;--agent-bg:#10302C;--tool:#AEB9CB;--tool-bg:#232B37;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}
code,.mono{font-family:var(--mono);font-size:.9em}

/* ---- shell */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.top{display:flex;align-items:center;gap:20px;padding:0 20px;min-height:60px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:24px;height:24px;color:var(--accent)}
.tabs{display:flex;gap:2px;align-self:stretch}
.tabs button{position:relative;display:flex;align-items:center;gap:8px;padding:0 14px;border:0;background:none;color:var(--muted);font-weight:600;font-size:14.5px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.tabs .n{font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--act-bg);color:var(--act)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.gsearch{display:flex;align-items:center;gap:8px;min-width:240px;padding:0 10px;height:38px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);color:var(--muted)}
.gsearch input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink)}
.gsearch kbd{font:11px var(--mono);padding:1px 5px;border:1px solid var(--line-2);border-radius:4px}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}
main{min-height:0;overflow:hidden}
.view{display:none;height:100%;min-height:0}
.view.on{display:block}
.scroll{height:100%;overflow:auto}

/* ---- shared bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;line-height:20px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.act{background:var(--act-bg);color:var(--act)} .chip.serious{background:var(--serious-bg);color:var(--serious)}
.chip.look{background:var(--look-bg);color:var(--look)} .chip.minor{background:var(--minor-bg);color:var(--minor)} .chip.record{background:var(--record-bg);color:var(--record)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.plain::before{display:none}
.chip.plain{background:var(--surface-2);color:var(--ink-2);font-weight:600}
.acct{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:1px 8px;border-radius:var(--r-sm);font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct i{width:8px;height:8px;border-radius:2px;flex:none;background:var(--ac,var(--muted))}
.tag{display:inline-block;padding:1px 8px;border-radius:var(--r-sm);font-size:12.5px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.muted{color:var(--muted)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.field{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface)}
.field input{border:0;outline:none;background:none;flex:1;min-width:0}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:var(--r);background:var(--surface-2)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .c{color:var(--muted);font-weight:500;margin-left:4px}

/* ---- overview */
.ov{max-width:1080px;margin:0 auto;padding:40px 24px 64px}
.verdict-line{font-size:34px;line-height:1.18;font-weight:750;letter-spacing:-.02em;margin:0 0 12px;max-width:22ch}
.verdict-line.ok{color:var(--ok)}
.lede{font-size:17px;color:var(--ink-2);margin:0 0 28px;max-width:68ch}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 36px}
.tier{text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.tier:hover{border-color:var(--line-2);background:var(--surface-2)}
.tier .num{font-size:28px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tier .lbl{font-weight:700}
.tier .sub{font-size:13px;color:var(--muted)}
.tier.act .num{color:var(--act)} .tier.serious .num{color:var(--serious)} .tier.look .num{color:var(--look)} .tier.minor .num{color:var(--record)}
.tier.zero .num{color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sec-h h2{font-size:20px;margin:0;letter-spacing:-.01em}
.start{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;margin-bottom:36px}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:14px 18px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.srow:first-child{border-top:0}
.srow:hover{background:var(--surface-2)}
.srow .t{font-weight:650;font-size:15.5px}
.srow .d{font-size:13.5px;color:var(--muted)}
.srow .go{color:var(--accent);display:flex;align-items:center;gap:4px;font-weight:600;font-size:14px;white-space:nowrap}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:36px;padding:0;list-style:none;counter-reset:how}
.how li{counter-increment:how;padding:16px 16px 16px 56px;position:relative;border-radius:var(--r);background:var(--surface-2)}
.how li::before{content:counter(how);position:absolute;left:16px;top:14px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:750;font-size:14px}
.how b{display:block;margin-bottom:2px}
.how span{font-size:14px;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fact{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.fact svg{margin-top:2px}
.fact b{display:block}
.fact span{font-size:14px;color:var(--ink-2)}
.fact.good svg{color:var(--ok)} .fact.bad svg{color:var(--act)}

/* ---- findings */
.fx{display:grid;grid-template-columns:minmax(320px,400px) 1fr;height:100%}
.fx-list{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.fx-tools{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.fx-tools label.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.fx-groups{overflow:auto;flex:1}
.tierhead{position:sticky;top:0;z-index:1;padding:10px 16px 6px;background:var(--surface);font-size:13px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.grp{display:grid;grid-template-columns:1fr auto;gap:4px 10px;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--line);border-left:4px solid transparent;background:none;text-align:left}
.grp:hover{background:var(--surface-2)}
.grp[aria-pressed="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.grp .t{font-weight:650;line-height:1.35}
.grp .m{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.grp .done{font-size:12.5px;color:var(--ok);font-weight:600}
.fx-detail{overflow:auto;min-height:0}
.dwrap{max-width:980px;padding:28px 32px 64px}
.dhead{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.dhead h1{font-size:26px;line-height:1.25;margin:0;letter-spacing:-.015em}
.explain{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 24px}
.explain div{padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.explain b{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.explain p{margin:0;font-size:14.5px}
.occ{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--surface-2);margin-bottom:16px}
.occ .where{font-size:14px;color:var(--ink-2);flex:1;min-width:220px}
.occ .where b{color:var(--ink)}
.verdict2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:14.5px;color:var(--ink-2)}
.verdict2 .cf{font-weight:700;color:var(--ink)}
.spec{margin:-12px 0 24px;padding:10px 14px;border-radius:var(--r);background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.spec b{color:var(--ink)}
.inshort{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;font-size:14px}
.inshort .st{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--act-bg);color:var(--act);font-weight:650}
.inshort .ar{color:var(--muted)}
.dest{font-size:12.5px;font-weight:650;color:var(--ink)}
.dest.none{color:var(--muted);font-weight:500}
.startmark{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:750;background:var(--you);color:#fff}
.card.start{outline:3px solid color-mix(in srgb,var(--you) 45%,transparent);outline-offset:2px}
.backlist{display:none}
.cause{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);border-left:5px solid var(--accent);background:var(--surface);margin-bottom:18px}
.cause.read{border-left-color:var(--act)} .cause.helper{border-left-color:var(--serious)} .cause.you{border-left-color:var(--you)}
.cause h3{margin:0 0 4px;font-size:15px}
.cause p{margin:0;color:var(--ink-2)}
.cause svg{margin-top:2px;width:22px;height:22px}
h2.sub{font-size:17px;margin:28px 0 10px;letter-spacing:-.005em}
.sure{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sure p{margin:0;flex:1;min-width:260px;color:var(--ink-2)}
.decide{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.decide button{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:160px;padding:10px 14px;border-radius:var(--r);border:1.5px solid var(--line-2);background:var(--surface);text-align:left}
.decide button b{font-size:14.5px}
.decide button span{font-size:12.5px;color:var(--muted)}
.decide button:hover{background:var(--surface-2)}
.decide button[aria-pressed="true"].tp{border-color:var(--act);background:var(--act-bg)}
.decide button[aria-pressed="true"].bn{border-color:var(--ok);background:var(--ok-bg)}
.decide button[aria-pressed="true"].fp{border-color:var(--minor);background:var(--minor-bg)}
.decide button[aria-pressed="true"].nr{border-color:var(--look);background:var(--look-bg)}
textarea.note{width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);resize:vertical}
.saved{font-size:13px;color:var(--ok);margin-left:6px}
details.tech{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
details.tech summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
dl.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:12px 0 0;font-size:13.5px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-all}

/* ---- story (swimlane) — the one loud element on the page */
.story{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:0 0 12px;overflow:hidden}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);background:var(--surface-2)}
.lanes div{display:flex;align-items:center;gap:8px;justify-content:center;padding:10px;font-weight:700;font-size:13.5px}
.lanes .you{color:var(--you)} .lanes .agent{color:var(--agent)} .lanes .tool{color:var(--tool)}
.srows{position:relative;padding:4px 12px 0;background-image:linear-gradient(90deg,transparent calc(33.333% - .5px),var(--line) calc(33.333% - .5px),var(--line) calc(33.333% + .5px),transparent calc(33.333% + .5px),transparent calc(66.666% - .5px),var(--line) calc(66.666% - .5px),var(--line) calc(66.666% + .5px),transparent calc(66.666% + .5px))}
.conn{height:34px;position:relative}
.conn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.conn path{fill:none;stroke:var(--line-2);stroke-width:2}
.conn path.hot{stroke:var(--act)}
.conn .gap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;color:var(--muted);background:var(--surface);padding:0 8px;border-radius:999px;border:1px solid var(--line)}
.srow2{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.card{grid-row:1;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.card.you{grid-column:1;border-color:color-mix(in srgb,var(--you) 35%,var(--line))}
.card.agent{grid-column:2;border-color:color-mix(in srgb,var(--agent) 35%,var(--line))}
.card.tool{grid-column:3;border-color:color-mix(in srgb,var(--tool) 35%,var(--line))}
.card.flag{border-color:var(--act);border-width:2px;background:var(--act-bg)}
.card .who{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.card.you .who{color:var(--you)} .card.agent .who{color:var(--agent)} .card.tool .who{color:var(--tool)}
.card .flagnote{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:750;color:var(--act)}
.card .v{font-weight:650;font-size:14.5px;line-height:1.35}
.card .body{font-size:13px;color:var(--ink-2);word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .body.code{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap}
.card .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.card .foot .btn{margin-left:auto}
.card .stepn{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--act);color:#fff;font-size:12px;font-weight:750}
.storyfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px 0;font-size:13px;color:var(--muted)}
.legend-dot{display:inline-flex;align-items:center;gap:6px}
.legend-dot i{width:12px;height:12px;border-radius:3px;border:2px solid var(--act);background:var(--act-bg)}

/* ---- activity */
.ax{display:grid;grid-template-columns:320px 1fr;height:100%}
.ax-rail{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.ax-rail .top2{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ax-rail .list{overflow:auto;flex:1}
.sess{display:flex;flex-direction:column;gap:3px;width:100%;padding:11px 14px;border:0;border-bottom:1px solid var(--line);border-left:4px solid transparent;background:none;text-align:left}
.sess:hover{background:var(--surface-2)}
.sess[aria-pressed="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.sess .t{font-weight:600;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sess .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

(function(){

const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));

function h(tag,attrs,...kids){

const icon=(id,cls)=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('class','i'+(cls?' '+cls:'')); s.setAttribute('aria-hidden','true'); const u=document.createElementNS('http://www.w3.org/2000/svg','use'); u.setAttribute('href','#'+id); s.appendChild(u); return s;};

// Secrets in evidence are masked wherever the page lists or summarises it:
// a screen share or a screenshot must not leak a working token. The proof
// panel can reveal the sealed line on purpose.
const SECRET_RE=[/\b(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|glpat-[A-Za-z0-9_-]{16,}|xox[abpcsr]-[A-Za-z0-9-]{10,}|sk-(?:ant-|proj-)?[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{6,}|npm_[A-Za-z0-9]{30,})/g,

const clip=(s,n)=>{s=mask(s); return s.length>n?s.slice(0,n-1).trimEnd()+'…':s;};

const root=document.documentElement;

const CONF={HIGH:['Very likely real','Several signals agree this happened as described.'],MEDIUM:['Needs your check','The pattern matches, but the same pattern also shows up in everyday work. The story on this page shows which one it is.'],LOW:['Weak match','Often everyday work. Look at the story, then decide.']};

function guessKind(id){ id=id||''; if(/SECRET|CRED|KEY|PASSWORD|TOKEN|SHADOW/.test(id)) return 'secrets'; if(/EXFIL|UPLOAD|DEST|PUSH|NETWORK/.test(id)) return 'leak'; if(/INJECT|INSTRUCTION|POISON|PROMPT|UNICODE/.test(id)) return 'inject'; if(/PERSIST|CRON|SERVICE|RUN_KEY|HOOK/.test(id)) return 'persist'; if(/DESTRUCT|DELET|WIPE|TAMPER|DISABLE/.test(id)) return 'destroy'; if(/EXEC|SHELL|DOWNLOAD/.test(id)) return 'code'; if(/MCP|CONFIG|PERMISSION/.test(id)) return 'config'; if(/AGENT|TASK|SPAWN/.test(id)) return 'agents'; return 'other'; }
function plain(f){
  const e=P[f.rule_id]; const kind=(e&&e[0])||(f.class==='building_block'?'routine':guessKind(f.rule_id)); const K=KIND[kind];
  return {kind, kindName:K.n, title:(e&&e[1])||f.title, what:(e&&e[2])||f.description||f.title, why:K.y, ask:(e&&e[3])||K.a, todo:(e&&e[4])||K.d};
}

// Findings grouped by what they are, not listed one by one: 1,237 findings
// on a real machine are about sixty kinds of thing.
function buildGroups(){
  const m={};
  S.findings.forEach(f=>{
    const gk=f.rule_id+'~'+f.severity;
    const g=m[gk]||(m[gk]={key:gk,rule:f.rule_id,items:[],sev:'INFO',conf:'LOW',sessions:new Set(),accts:new Set(),routine:true});
    if(f.account) g.accts.add(f.account);
    g.items.push(f); if(sevOf(f.severity).r>sevOf(g.sev).r) g.sev=f.severity;
    if(({HIGH:3,MEDIUM:2,LOW:1}[f.confidence]||0)>({HIGH:3,MEDIUM:2,LOW:1}[g.conf]||0)) g.conf=f.confidence;
    if(f.session) g.sessions.add(f.session); if(f.class!=='building_block') g.routine=false;
  });
  const CR={HIGH:3,MEDIUM:2,LOW:1};
  S.groups=Object.values(m).map(g=>{ g.items.sort((a,b)=>sevOf(b.severity).r-sevOf(a.severity).r||(CR[b.confidence]||0)-(CR[a.confidence]||0)||String(b.timestamp).localeCompare(String(a.timestamp))); g.p=plain(g.items[0]); if(g.routine) g.p.kind='routine'; return g; })
    .sort((a,b)=>sevOf(b.sev).r-sevOf(a.sev).r||(CR[b.conf]||0)-(CR[a.conf]||0)||b.items.length-a.items.length);
}
const tierOf=g=>g.p.kind==='routine'&&sevOf(g.sev).r<=2?'background':(g.sev==='CRITICAL'||g.sev==='HIGH')?'attention':g.sev==='MEDIUM'?'look':'background';
const reviewed=g=>g.items.filter(f=>verdictOf(f.key)).length;

// openGroup takes a group key (rule~severity) or a bare rule id; with a
// finding index it lands on the group and occurrence holding that finding.
function openGroup(key,index){
  findReady.then(()=>{
    let g=null; const fi=index!=null?S.byIndex[index]:null;
    if(fi) g=S.groups.find(x=>x.key===fi.rule_id+'~'+fi.severity);
    if(!g) g=S.groups.find(x=>x.key===key)||S.groups.find(x=>x.rule===key); if(!g) return;
    if(S.tier!=='all'&&tierOf(g)!==S.tier) S.tier=tierOf(g);
    if(S.acct&&fi&&fi.account!==S.acct) S.acct='';
    S.group=g.key; S.occ=0; if(index!=null){ const i=g.items.findIndex(f=>String(f.index)===String(index)); if(i>=0) S.occ=i; }
    if(!$('#v-findings').classList.contains('on')) go('findings',true);
    renderGroups(); renderFinding();
  });
}

function renderShort(box,steps,f,acc){
  box.replaceChildren(); const fl=steps.filter(x=>x.flag); if(!fl.length) return;
  const line=h('div',{class:'inshort'},h('b',null,fl.length>1?'In short:':'Flagged step:'));
  fl.forEach((x,i)=>{ if(i) line.append(h('span',{class:'ar','aria-hidden':'true'},'→')); line.append(h('span',{class:'st'},fl.length>1?String(i+1)+'. ':'',cap(x.role&&x.role!=='evidence'?x.role:verbOf(x.n)))); });
  box.append(line);
  const dests=[...new Set(steps.flatMap(x=>x.n.dest||[]))];
  if(p0(f)==='leak'||dests.length) box.append(h('p',{class:'dest'+(dests.length?'':' none'),style:'margin:0 0 12px'},dests.length?'Outside addresses in these steps: '+dests.join(', '):'No outside address is visible in these steps — nothing here shows data actually leaving. Check the tool answers in the story for errors or success.'));
  // Did it work? Read the answer to the last flagged step.
  const lastF=fl[fl.length-1], after=steps.filter(x=>!x.flag&&x.n.type==='tool_result'&&String(x.n.ts)>=String(lastF.n.ts));
  const ans=after.map(x=>String(x.n.label||'')).join(' ');
  if(p0(f)==='leak'&&ans){ let r=null;
    if(/Bad credentials|401|403|Unauthorized|Forbidden|permission denied|not found|could not resolve|Connection refused|timed out/i.test(ans)){ r=['The outside service refused or failed — probably nothing was sent. Check the last tool answer in the story.','none'];
      // Still urgent — the agent had the secret in hand — but it did not
      // demonstrably leave, and the page must not say it did.
      if(S.h1) S.h1.textContent=plain(f).title.replace(/sent data out/,'tried to send data out')+' (the attempt was refused)';
      if(S.whyP) S.whyP.textContent='The agent had the password or key in hand. The send was refused this time, but whoever controls the agent could use it again.';
      if(S.todoP) S.todoP.textContent='Have the password or key it read replaced today, even though this attempt was refused. Send the note below to whoever manages that account.'; }
    else if(/status[=:]\s*20\d|HTTP\/\S+ 20\d|"ok"\s*:\s*true|uploaded|created/i.test(ans)) r=['The outside service answered successfully — data may have been sent.',''];
    if(r) box.append(h('p',{class:'dest '+r[1],style:'margin:-6px 0 12px'},'Result: '+r[0])); }
  if(acc) box.append(h('p',{class:'muted',style:'margin:0 0 12px;font-size:13.5px'},'Every step below ran under ',acctTag(f.account,true),'.'));
}
const cap=t=>{t=String(t||''); return t.charAt(0).toUpperCase()+t.slice(1);};

function laneOf(n){ if(n.type==='human_prompt') return 'you'; if(n.type==='tool_result') return 'tool'; if(n.type==='model_response'&&/^\s*</.test(String(n.label||''))) return 'tool'; return 'agent'; }
const isHelper=a=>a&&!String(a).startsWith('main:');
function verbOf(n){
  const L=String(n.label||''), t=n.type;
  if(t==='human_prompt') return isAuto(L)?'An automatic message was sent (a skill or plugin, on your behalf)':'You asked';
  if(t==='tool_result'&&/^(File created successfully|The file .* has been (updated|created)|Successfully (wrote|edited|created))/i.test(L)) return 'Confirmation that the agent’s file was saved';
  if(t==='tool_result') return n.role==='tool result the agent had just consumed'?'A tool answered the agent (it had asked earlier)':'The tool answered';
  if(t==='agent_spawn') return 'The agent started a helper agent';
  if(t==='agent_message') return 'The helper agent was given instructions';
  if(t==='model_response') return /^\s*</.test(L)?'Setup message from the app':L.trim()?'The agent replied':'The agent replied (no visible text)';
  if(t==='trace_gap') return 'The log has a gap here';
  if(t==='session_meta') return 'Background record (not an action)';
  if(L.startsWith('$ ')) return (isHelper(n.agent)?'A helper agent':'The agent')+' ran a command';
  const tool=L.split(' ')[0]||'';
  if(/^(Write|Edit|MultiEdit|NotebookEdit|write_file|edit_file|apply_patch)/i.test(tool)) return 'The agent changed a file';
  if(/^(Read|read_file|View|cat)/i.test(tool)) return 'The agent opened a file';
  if(/^(WebFetch|WebSearch|fetch)/i.test(tool)) return 'The agent went to the web';
  if(/^mcp__/i.test(tool)) return 'The agent used the plugin tool “'+tool.replace(/^mcp__/,'').replace(/__/g,' › ')+'”';
  return tool?'The agent used the tool “'+tool+'”':'The agent acted';
}
function bodyOf(n){ let L=mask(n.label||''); if(L.startsWith('$ ')) return {code:true,text:L.slice(2)}; if(n.type==='tool_call'){ const sp=L.indexOf(' '); if(sp>0) L=L.slice(sp+1); } return {code:n.type==='tool_call',text:L}; }
function storyItems(root){
  if(!root) return [];
  const out=[], seen={};
  const push=(n,extra)=>{ const id=n.event_id||n.id; if(seen[id]){ Object.assign(seen[id],extra&&extra.flag?extra:{}); return; } const it=Object.assign({n,lane:laneOf(n)},extra||{}); seen[id]=it; out.push(it); };
  (root.children||[]).forEach((s,i)=>{
    const kids=s.children||[];
    kids.filter(c=>c.role!=='result returned to the agent').forEach(c=>push(c,{role:c.role}));
    push(s,{flag:true,step:(root.children.length>1?i+1:0),role:s.role});
    kids.filter(c=>c.role==='result returned to the agent').forEach(c=>push(c,{role:c.role}));
  });
  return out.map((x,i)=>Object.assign(x,{i})).sort((a,b)=>(String(a.n.ts||'')).localeCompare(String(b.n.ts||''))||a.i-b.i);
}

function storyCard(it,isStart){

    g.nodes.forEach(n=>{const p=pos[n.ID]; if(!p) return; const gr=document.createElementNS(NS,'g'); gr.setAttribute('class',n.Kind+(n.Orphan?' orphan':'')+(n.Subagent?' sub':'')); gr.setAttribute('transform','translate('+p.x+','+p.y+')'); const r=document.createElementNS(NS,'rect'); r.setAttribute('width',bw); r.setAttribute('height',34); r.setAttribute('rx',8); gr.append(r); const t=document.createElementNS(NS,'text'); t.setAttribute('x',10); t.setAttribute('y',21); t.textContent=n.Kind==='session'?clip(sessName(n.Session),38):(n.Subagent?'Helper ':'Main agent ')+(n.Subagent?clip(n.Label,22):'')+(n.Orphan?' — no known parent':'')+' ('+n.Events+')'; gr.append(t); gr.style.cursor='pointer'; gr.addEventListener('click',()=>openSession(n.Session)); svg.append(gr);});
    holder.replaceChildren(svg);
  });
}
function renderEvidence(box){
  Promise.all([caseReady,acctReady]).then(([c])=>{
    const v=c.verify, ok=v&&(!v.Problems||!v.Problems.length), full=v&&v.Depth==='full';
    const dl=h('dl',{class:'facts2'}); const add=(k,val,mono)=>{ if(val==null||val==='') return; dl.append(h('dt',null,k),h('dd',{class:mono?'mono':null},String(val))); };
    add('Computer',c.manifest.host); add('System',({darwin:'macOS',linux:'Linux',windows:'Windows'}[c.manifest.os]||c.manifest.os||'')+({arm64:' (Apple silicon / ARM)',amd64:' (Intel/AMD 64-bit)'}[c.manifest.arch]||'')); add('Collected',when(c.manifest.created_utc)); add('Case number',c.manifest.case_id,true); add('Files collected',c.artifacts.toLocaleString()); add('Recorded actions',c.events.toLocaleString()); add('Conversations',c.sessions.toLocaleString()); add('Agents',c.agents.toLocaleString()); add('Signature',c.signature==='unsigned'?'Not signed (the evidence is still checked for changes)':c.signature); add('AgentDFIR version',c.version);
    const vb=h('button',{class:'btn sm',onclick:()=>{vb.disabled=true; vb.textContent='Checking every file… this reads the whole case'; api('/api/verify').then(r=>{S.caseinfo.verify=r; renderMore();}).catch(e=>{vb.textContent='Check failed: '+e.message;});}},'Re-check every file now');
    box.append(h('div',{class:'panel'},h('h2',null,ok?'Evidence is intact':'Evidence integrity check failed'),h('p',null,ok?(full?'Every collected file was re-hashed and matches what was sealed.':'The seal, the collection log and the file list all check out. A full check re-reads every file.'):'Problems: '+(v&&v.Problems||[]).join('; ')),ok&&!full?vb:null));
    box.append(h('div',{class:'panel'},h('h2',null,'This case'),dl));
    if(S.acctList.length) box.append(h('div',{class:'panel'},h('h2',null,'Accounts'),h('p',null,'Read from each app’s own settings file; passwords and tokens in those files are never shown.'),h('table',{class:'t'},h('tr',null,['Account','Actions','Read from'].map(c=>h('th',null,c))),S.acctList.map(a=>h('tr',null,h('td',null,acctTag(a.key,true)),h('td',null,a.events.toLocaleString()),h('td',{class:'mono'},a.source||'not collected'))))));
  });
}

// ================= NAV =================
const VIEWS=['overview','findings','activity','more'];
function go(name,quiet){
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===name)));
  VIEWS.forEach(v=>$('#v-'+v).classList.toggle('on',v===name));
  if(!quiet) history.replaceState(null,'','#'+name);
  if(name==='overview') renderOverview();
  if(name==='findings'){ renderGroups(); if(!quiet||!S.group) renderFinding(); }
  if(name==='activity'&&!quiet){ renderSessions(); renderActHead(); loadEvents(); }
  if(name==='more'&&!quiet) renderMore();
}
$$('.tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
$('#gq').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.value.trim()){ const q=e.target.value.trim(); moreTab='search'; go('more',true); $$('#moreseg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m==='search'))); const box=$('#more'); box.replaceChildren(); renderSearch(box,q); } });
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault(); const g=$('#gq'); if(getComputedStyle(g.parentNode).display!=='none'){g.focus(); g.select();} else {moreTab='search'; go('more');} return;}
  if(e.key==='Escape'&&$('#drawer').classList.contains('on')){closeDrawer(); return;}
  if(e.target.matches('input,select,textarea')) return;
  if($('#v-activity').classList.contains('on')&&!$('#drawer').classList.contains('on')){ const a=S.act; if(e.key==='j'&&a.sel<a.rows.length-1){e.preventDefault(); selectEv(a.sel+1);} else if(e.key==='k'&&a.sel>0){e.preventDefault(); selectEv(a.sel-1);} }
  if($('#v-findings').classList.contains('on')&&S.group&&!$('#drawer').classList.contains('on')){ const g=S.groups.find(x=>x.key===S.group); const L=g?(S.acct?g.items.filter(x=>x.account===S.acct):g.items).length:0; if(e.key==='ArrowRight'&&g&&S.occ<L-1){S.occ++; renderFinding();} else if(e.key==='ArrowLeft'&&S.occ>0){S.occ--; renderFinding();} }
});
function debounce(fn,ms){let t; return(...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms);};}

// Deep links. The old explorer's links (#findings/<index>, #session/<id>,
// #event/<id>, #search/<q>) still land in the right place.
function route(){
  const hs=decodeURIComponent(location.hash.slice(1)); const parts=hs.split('/'); const v=parts[0];
  if(v==='findings'&&parts[1]){ findReady.then(()=>{ if(/^\d+$/.test(parts[1])&&!parts[2]){ const f=S.byIndex[parts[1]]; if(f) openGroup(f.rule_id,f.index); else go('findings'); } else openGroup(parts[1],parts[2]); }); return; }
  if(v==='activity'||v==='session'){ go('activity',true); openSession(parts.slice(1).join('/')); return; }
  if(v==='event'&&parts[1]){ go('activity'); showProof(parts.slice(1).join('/')); return; }
  if((v==='more'&&parts[1]==='search'&&parts[2])||(v==='search'&&parts[1])){ moreTab='search'; go('more',true); $$('#moreseg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m==='search'))); const box=$('#more'); box.replaceChildren(); renderSearch(box,parts.slice(v==='more'?2:1).join('/')); return; }
  if(v==='more'&&parts[1]){ moreTab=parts[1]; go('more'); return; }
  if(v==='timeline'||v==='sessions'){ go(v==='timeline'?'activity':'overview'); return; }
  if(v==='topology'){ moreTab='map'; go('more'); return; }
  if(v==='extras'){ moreTab='mcp'; go('more'); return; }
  go(VIEWS.includes(v)?v:'overview');
}
route();
})();
